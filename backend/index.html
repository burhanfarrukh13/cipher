<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cipher</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #e8e9ec; --muted: #8a8f9a; --accent: #5a8dee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
  }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .chat { flex: 2; }
  .tasks { flex: 1; border-right: none; }
  h2 { padding: 16px; margin: 0; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; line-height: 1.5; }
  .msg.user { color: var(--accent); }
  .msg.user::before { content: "You: "; opacity: .6; }
  .msg.assistant::before { content: "Cipher: "; opacity: .6; }
  .input-row { display: flex; padding: 12px; border-top: 1px solid var(--border); gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  button {
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover { opacity: .9; }
  .task-list { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .task { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .task.done { opacity: .4; text-decoration: line-through; }
  .task span { flex: 1; }
  .task button { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 12px; }
  .status { padding: 8px 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="panel chat">
  <h2>Cipher</h2>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <input type="text" id="chatInput" placeholder="Ask Cipher anything..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<div class="panel tasks">
  <h2>Tasks</h2>
  <div class="status" id="status"></div>
  <div class="task-list" id="taskList"></div>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="New task..." onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">Add</button>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let history = [];

async function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMessage("user", text);
  history.push({ role: "user", content: text });

  const res = await fetch(`${API}/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, history: history.slice(0, -1) })
  });
  const data = await res.json();
  appendMessage("assistant", data.reply || data.detail || "Something went wrong.");
  history.push({ role: "assistant", content: data.reply || "" });
}

function appendMessage(role, text) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  const box = document.getElementById("messages");
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function loadTasks() {
  const res = await fetch(`${API}/tasks`);
  const tasks = await res.json();
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(t => {
    const row = document.createElement("div");
    row.className = "task" + (t.done ? " done" : "");
    row.innerHTML = `<span>${t.title}</span>`;
    if (!t.done) {
      const doneBtn = document.createElement("button");
      doneBtn.textContent = "done";
      doneBtn.onclick = async () => { await fetch(`${API}/tasks/${t.id}/complete`, { method: "POST" }); loadTasks(); };
      row.appendChild(doneBtn);
    }
    const delBtn = document.createElement("button");
    delBtn.textContent = "x";
    delBtn.onclick = async () => { await fetch(`${API}/tasks/${t.id}`, { method: "DELETE" }); loadTasks(); };
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

async function addTask() {
  const input = document.getElementById("taskInput");
  const title = input.value.trim();
  if (!title) return;
  input.value = "";
  await fetch(`${API}/tasks`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title })
  });
  loadTasks();
}

async function checkStatus() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    document.getElementById("status").textContent =
      data.smart_home_configured ? "Smart home: connected" : "Smart home: not configured (see README)";
  } catch {
    document.getElementById("status").textContent = "Backend not running — start it with uvicorn (see README)";
  }
}

loadTasks();
checkStatus();
</script>

</body>
</html>
